<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<title>SNAKE PUZZLE</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #111;
    color: white;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    overflow: hidden;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

#game {
    width: min(100vw, 520px);
    min-height: 100vh;
    padding: 18px 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* ---------- HEADER ---------- */

.header {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.title {
    font-size: 27px;
    font-weight: 900;
    letter-spacing: 2px;
}

.level {
    font-size: 14px;
    font-weight: 700;
    background: #222;
    border: 1px solid #333;
    padding: 7px 11px;
    border-radius: 10px;
}

/* ---------- INFO ---------- */

.info {
    width: 100%;
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
    color: #aaa;
    font-size: 13px;
}

.info strong {
    color: white;
}

/* ---------- BOARD ---------- */

#board {
    width: min(94vw, 480px);
    aspect-ratio: 1 / 1;

    display: grid;

    background: #191919;

    border: 3px solid #303030;
    border-radius: 18px;

    padding: 5px;

    box-shadow:
        0 15px 40px rgba(0,0,0,.5);

    touch-action: none;
}

.cell {
    position: relative;

    border-radius: 7px;

    background: #222;

    margin: 2px;

    transition:
        transform .12s ease,
        background .12s ease;
}

/* ---------- WALL ---------- */

.wall {
    background:
        linear-gradient(
            135deg,
            #3b3b3b,
            #272727
        );

    box-shadow:
        inset 0 2px 0 rgba(255,255,255,.04);
}

/* ---------- GOAL ---------- */

.goal {
    background: #17351d;
}

.goal::after {
    content: "";
    position: absolute;

    width: 42%;
    height: 42%;

    left: 29%;
    top: 29%;

    border-radius: 50%;

    background: #4cff78;

    box-shadow:
        0 0 12px rgba(76,255,120,.7);
}

/* ---------- SNAKE ---------- */

.snake {
    background: #28d94f;

    box-shadow:
        inset 0 2px 0 rgba(255,255,255,.25),
        0 3px 8px rgba(0,0,0,.25);

    z-index: 2;
}

.snake-head {
    background: #55ff70;
}

.snake-head::before,
.snake-head::after {
    content: "";

    position: absolute;

    width: 18%;
    height: 18%;

    background: #111;

    border-radius: 50%;

    top: 27%;
}

.snake-head::before {
    left: 23%;
}

.snake-head::after {
    right: 23%;
}

/* ---------- CONTROLS ---------- */

.controls {
    margin-top: 16px;

    display: grid;

    grid-template-columns:
        72px 72px 72px;

    grid-template-rows:
        58px 58px;

    gap: 8px;
}

.control {
    border: none;

    border-radius: 16px;

    background: #262626;

    color: white;

    font-size: 26px;

    font-weight: 900;

    box-shadow:
        0 5px 0 #151515;

    touch-action: manipulation;
}

.control:active {
    transform: translateY(4px);

    box-shadow:
        0 1px 0 #151515;
}

.up {
    grid-column: 2;
    grid-row: 1;
}

.left {
    grid-column: 1;
    grid-row: 2;
}

.down {
    grid-column: 2;
    grid-row: 2;
}

.right {
    grid-column: 3;
    grid-row: 2;
}

/* ---------- BUTTONS ---------- */

.buttons {
    display: flex;

    gap: 10px;

    margin-top: 15px;
}

.action {
    border: 1px solid #333;

    background: #1d1d1d;

    color: white;

    padding: 11px 18px;

    border-radius: 12px;

    font-weight: 800;
}

.action:active {
    transform: scale(.96);
}

/* ---------- MESSAGE ---------- */

#message {
    position: fixed;

    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    background:
        rgba(0,0,0,.72);

    z-index: 100;
}

.modal {
    width: min(88vw, 350px);

    background: #1b1b1b;

    border:
        1px solid #3a3a3a;

    border-radius: 24px;

    padding: 28px;

    text-align: center;

    box-shadow:
        0 20px 60px rgba(0,0,0,.7);
}

.modal h2 {
    margin: 0 0 10px;

    font-size: 30px;
}

.modal p {
    color: #aaa;

    margin-bottom: 22px;
}

.next {
    width: 100%;

    border: none;

    background: #42e85f;

    color: #071209;

    font-size: 17px;

    font-weight: 900;

    padding: 14px;

    border-radius: 13px;
}

/* ---------- SMALL SCREEN ---------- */

@media (max-height: 700px) {

    #game {
        padding-top: 8px;
    }

    .title {
        font-size: 23px;
    }

    .controls {
        margin-top: 8px;

        grid-template-columns:
            62px 62px 62px;

        grid-template-rows:
            48px 48px;
    }

    .buttons {
        margin-top: 8px;
    }
}
</style>
</head>

<body>

<div id="game">

    <div class="header">

        <div class="title">
            🐍 SNAKE PUZZLE
        </div>

        <div class="level">
            LEVEL <span id="level">1</span>
        </div>

    </div>

    <div class="info">

        <div>
            MOVES:
            <strong id="moves">0</strong>
        </div>

        <div>
            BEST:
            <strong id="best">—</strong>
        </div>

    </div>

    <div id="board"></div>

    <div class="controls">

        <button
            class="control up"
            onclick="move(0,-1)">
            ▲
        </button>

        <button
            class="control left"
            onclick="move(-1,0)">
            ◀
        </button>

        <button
            class="control down"
            onclick="move(0,1)">
            ▼
        </button>

        <button
            class="control right"
            onclick="move(1,0)">
            ▶
        </button>

    </div>

    <div class="buttons">

        <button
            class="action"
            onclick="restart()">
            ↻ リセット
        </button>

        <button
            class="action"
            onclick="newGame()">
            次のステージ
        </button>

    </div>

</div>


<div id="message">

    <div class="modal">

        <h2>🎉 CLEAR!</h2>

        <p>
            <span id="clearMoves">0</span>
            MOVES
        </p>

        <button
            class="next"
            onclick="newGame()">
            NEXT LEVEL
        </button>

    </div>

</div>


<script>

/* =========================================================
   SNAKE PUZZLE
   ========================================================= */

/* ---------- SETTINGS ---------- */

const SIZE = 8;


/* ---------- LEVEL DATA ---------- */

/*
    0 = empty
    1 = wall
*/

const levels = [

    {
        snake: [
            {x:1,y:6},
            {x:1,y:5},
            {x:1,y:4}
        ],

        goal: {
            x:6,
            y:1
        },

        walls: [
            [3,0],
            [3,1],
            [3,2],
            [3,3],

            [5,3],
            [5,4],
            [5,5],

            [2,6],
            [3,6],
            [4,6]
        ]
    },

    {
        snake: [
            {x:1,y:1},
            {x:2,y:1},
            {x:3,y:1}
        ],

        goal: {
            x:6,
            y:6
        },

        walls: [
            [0,3],
            [1,3],
            [2,3],

            [4,1],
            [4,2],
            [4,3],

            [5,4],
            [6,4],
            [7,4],

            [2,6]
        ]
    },

    {
        snake: [
            {x:6,y:6},
            {x:6,y:5},
            {x:6,y:4],
            {x:5,y:4}
        ],

        goal: {
            x:1,
            y:1
        },

        walls: [
            [1,2],
            [2,2],
            [3,2],
            [4,2],

            [3,3],

            [1,5],
            [2,5],
            [3,5],

            [5,1]
        ]
    },

    {
        snake: [
            {x:1,y:6},
            {x:2,y:6},
            {x:3,y:6},
            {x:3,y:5}
        ],

        goal: {
            x:6,
            y:1
        },

        walls: [
            [1,1],
            [2,1],
            [3,1],

            [5,2],
            [5,3],
            [5,4],

            [1,4],
            [2,4],

            [3,3],
            [4,3]
        ]
    },

    {
        snake: [
            {x:6,y:1},
            {x:6,y:2},
            {x:5,y:2},
            {x:4,y:2}
        ],

        goal: {
            x:1,
            y:6
        },

        walls: [
            [2,0],
            [2,1],
            [2,2],

            [4,4],
            [5,4],
            [6,4],

            [3,6],
            [4,6],
            [5,6],

            [1,3]
        ]
    }

];


/* ---------- GAME STATE ---------- */

let levelIndex = 0;

let snake = [];

let goal = null;

let walls = [];

let moves = 0;

let gameOver = false;


/* ---------- DOM ---------- */

const board =
    document.getElementById("board");

const levelText =
    document.getElementById("level");

const movesText =
    document.getElementById("moves");

const bestText =
    document.getElementById("best");

const message =
    document.getElementById("message");

const clearMoves =
    document.getElementById("clearMoves");


/* ---------- LOAD LEVEL ---------- */

function loadLevel(index) {

    levelIndex =
        index % levels.length;

    const data =
        levels[levelIndex];

    snake =
        data.snake.map(p => ({
            x:p.x,
            y:p.y
        }));

    goal = {
        x:data.goal.x,
        y:data.goal.y
    };

    walls =
        data.walls.map(p => ({
            x:p[0],
            y:p[1]
        }));

    moves = 0;

    gameOver = false;

    message.style.display =
        "none";

    levelText.textContent =
        levelIndex + 1;

    movesText.textContent =
        moves;

    updateBest();

    draw();

}


/* ---------- DRAW ---------- */

function draw() {

    board.innerHTML = "";

    board.style.gridTemplateColumns =
        `repeat(${SIZE}, 1fr)`;

    board.style.gridTemplateRows =
        `repeat(${SIZE}, 1fr)`;


    for (let y = 0; y < SIZE; y++) {

        for (let x = 0; x < SIZE; x++) {

            const cell =
                document.createElement("div");

            cell.className = "cell";


            /* wall */

            if (isWall(x,y)) {

                cell.classList.add("wall");

            }


            /* goal */

            if (
                goal.x === x &&
                goal.y === y
            ) {

                cell.classList.add("goal");

            }


            /* snake */

            const snakeIndex =
                snake.findIndex(
                    p =>
                        p.x === x &&
                        p.y === y
                );


            if (snakeIndex !== -1) {

                cell.classList.add("snake");

                if (snakeIndex === 0) {

                    cell.classList.add(
                        "snake-head"
                    );

                }

            }


            board.appendChild(cell);

        }

    }

}


/* ---------- MOVE ---------- */

function move(dx,dy) {

    if (gameOver) {
        return;
    }

    const head = snake[0];

    const next = {
        x: head.x + dx,
        y: head.y + dy
    };


    /* outside */

    if (
        next.x < 0 ||
        next.x >= SIZE ||
        next.y < 0 ||
        next.y >= SIZE
    ) {

        shake();

        return;

    }


    /* wall */

    if (
        isWall(
            next.x,
            next.y
        )
    ) {

        shake();

        return;

    }


    /*
        自分の体にぶつかったら
        動けない
    */

    if (
        snake.some(
            p =>
                p.x === next.x &&
                p.y === next.y
        )
    ) {

        shake();

        return;

    }


    /*
        頭を先頭に追加
    */

    snake.unshift(next);

    /*
        Puzzle Snakeなので
        尻尾を残すことで
        体が1マスずつ伸びる
    */

    moves++;

    movesText.textContent =
        moves;


    /*
        一定長以上になったら
        尻尾を削除して
        パズルとして動かす
    */

    if (snake.length > 4) {

        snake.pop();

    }


    draw();


    /* goal */

    if (
        next.x === goal.x &&
        next.y === goal.y
    ) {

        clear();

    }

}


/* ---------- WALL CHECK ---------- */

function isWall(x,y) {

    return walls.some(
        p =>
            p.x === x &&
            p.y === y
    );

}


/* ---------- CLEAR ---------- */

function clear() {

    gameOver = true;

    clearMoves.textContent =
        moves;

    saveBest();

    setTimeout(() => {

        message.style.display =
            "flex";

    }, 180);

}


/* ---------- RESTART ---------- */

function restart() {

    loadLevel(levelIndex);

}


/* ---------- NEXT ---------- */

function newGame() {

    loadLevel(
        levelIndex + 1
    );

}


/* ---------- SHAKE ---------- */

function shake() {

    board.style.transform =
        "translateX(-5px)";

    setTimeout(() => {

        board.style.transform =
            "translateX(5px)";

    }, 50);

    setTimeout(() => {

        board.style.transform =
            "translateX(0)";

    }, 100);

}


/* ---------- BEST SCORE ---------- */

function bestKey() {

    return (
        "snakePuzzleBest_" +
        levelIndex
    );

}


function updateBest() {

    const best =
        localStorage.getItem(
            bestKey()
        );

    bestText.textContent =
        best || "—";

}


function saveBest() {

    const old =
        localStorage.getItem(
            bestKey()
        );

    if (
        !old ||
        moves < Number(old)
    ) {

        localStorage.setItem(
            bestKey(),
            moves
        );

    }

    updateBest();

}


/* =========================================================
   KEYBOARD
   ========================================================= */

document.addEventListener(
    "keydown",
    e => {

        if (
            e.key === "ArrowUp" ||
            e.key === "w"
        ) {

            move(0,-1);

        }

        if (
            e.key === "ArrowDown" ||
            e.key === "s"
        ) {

            move(0,1);

        }

        if (
            e.key === "ArrowLeft" ||
            e.key === "a"
        ) {

            move(-1,0);

        }

        if (
            e.key === "ArrowRight" ||
            e.key === "d"
        ) {

            move(1,0);

        }

        if (e.key === "r") {

            restart();

        }

    }
);


/* =========================================================
   SWIPE
   ========================================================= */

let touchStartX = 0;
let touchStartY = 0;


board.addEventListener(
    "touchstart",
    e => {

        const t =
            e.changedTouches[0];

        touchStartX =
            t.clientX;

        touchStartY =
            t.clientY;

    },
    {passive:true}
);


board.addEventListener(
    "touchend",
    e => {

        const t =
            e.changedTouches[0];

        const dx =
            t.clientX -
            touchStartX;

        const dy =
            t.clientY -
            touchStartY;


        const minSwipe = 25;


        if (
            Math.abs(dx) <
                minSwipe &&
            Math.abs(dy) <
                minSwipe
        ) {

            return;

        }


        if (
            Math.abs(dx) >
            Math.abs(dy)
        ) {

            if (dx > 0) {

                move(1,0);

            } else {

                move(-1,0);

            }

        } else {

            if (dy > 0) {

                move(0,1);

            } else {

                move(0,-1);

            }

        }

    },
    {passive:true}
);


/* ---------- START ---------- */

loadLevel(0);

</script>

</body>
</html>
