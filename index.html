<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               minimum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<meta name="format-detection" content="telephone=no">

<title>SNAKE PUZZLE</title>

<style>

/* =====================================================
   iPhone操作対策
   ===================================================== */

* {
    box-sizing: border-box;

    -webkit-user-select: none;
    user-select: none;

    -webkit-touch-callout: none;

    -webkit-tap-highlight-color: transparent;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #101010;

    color: white;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    touch-action: none;

    overscroll-behavior: none;

    -webkit-text-size-adjust: 100%;
}


/* =====================================================
   GAME
   ===================================================== */

#game {

    width: 100%;
    max-width: 520px;

    height: 100dvh;

    margin: 0 auto;

    padding:
        max(14px, env(safe-area-inset-top))
        14px
        max(14px, env(safe-area-inset-bottom))
        14px;

    display: flex;

    flex-direction: column;

    align-items: center;

    overflow: hidden;

    touch-action: none;
}


/* =====================================================
   HEADER
   ===================================================== */

.header {

    width: 100%;

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 8px;
}

.title {

    font-size: 24px;

    font-weight: 900;

    letter-spacing: 1px;
}

.level {

    background: #222;

    border: 1px solid #3a3a3a;

    border-radius: 10px;

    padding: 7px 10px;

    font-size: 13px;

    font-weight: 800;
}


/* =====================================================
   INFO
   ===================================================== */

.info {

    width: 100%;

    display: flex;

    justify-content: space-between;

    margin-bottom: 8px;

    font-size: 13px;

    color: #999;
}

.info strong {

    color: white;
}


/* =====================================================
   BOARD
   ===================================================== */

#board {

    width: min(92vw, 480px);

    aspect-ratio: 1 / 1;

    flex-shrink: 0;

    display: grid;

    grid-template-columns:
        repeat(8, 1fr);

    grid-template-rows:
        repeat(8, 1fr);

    gap: 4px;

    padding: 6px;

    background: #292929;

    border:
        3px solid #3d3d3d;

    border-radius: 18px;

    box-shadow:
        0 12px 35px rgba(0,0,0,.55);

    touch-action: none;

    -webkit-user-select: none;
    user-select: none;
}


/* =====================================================
   CELL
   ===================================================== */

.cell {

    min-width: 0;
    min-height: 0;

    position: relative;

    border-radius: 7px;

    background: #181818;

    touch-action: none;
}


/* =====================================================
   WALL
   ===================================================== */

.wall {

    background:
        linear-gradient(
            135deg,
            #4a4a4a,
            #292929
        );

    box-shadow:
        inset 0 2px 2px rgba(255,255,255,.08);
}


/* =====================================================
   GOAL
   ===================================================== */

.goal {

    background: #16331c;
}

.goal::before {

    content: "";

    position: absolute;

    width: 48%;
    height: 48%;

    left: 26%;
    top: 26%;

    border-radius: 50%;

    background: #52ff72;

    box-shadow:
        0 0 14px rgba(82,255,114,.8);
}


/* =====================================================
   SNAKE
   ===================================================== */

.snake {

    background: #27d94d;

    box-shadow:
        inset 0 2px 0 rgba(255,255,255,.2),
        0 3px 6px rgba(0,0,0,.3);

    z-index: 5;
}

.snake-head {

    background: #63ff7b;

}


/* 目 */

.snake-head::before,
.snake-head::after {

    content: "";

    position: absolute;

    width: 17%;
    height: 17%;

    top: 27%;

    background: #111;

    border-radius: 50%;
}

.snake-head::before {

    left: 22%;
}

.snake-head::after {

    right: 22%;
}


/* =====================================================
   CONTROLS
   ===================================================== */

.controls {

    display: grid;

    grid-template-columns:
        68px 68px 68px;

    grid-template-rows:
        55px 55px;

    gap: 7px;

    margin-top: 12px;

    touch-action: none;
}

.control {

    border: 0;

    border-radius: 15px;

    background: #292929;

    color: white;

    font-size: 25px;

    font-weight: 900;

    box-shadow:
        0 4px 0 #151515;

    touch-action: manipulation;

    -webkit-touch-callout: none;

    -webkit-user-select: none;
    user-select: none;

    outline: none;
}

.control:active {

    transform:
        translateY(3px);

    box-shadow:
        0 1px 0 #151515;
}

.up {

    grid-column: 2;
    grid-row: 1;
}

.left {

    grid-column: 1;
    grid-row: 2;
}

.down {

    grid-column: 2;
    grid-row: 2;
}

.right {

    grid-column: 3;
    grid-row: 2;
}


/* =====================================================
   ACTION BUTTONS
   ===================================================== */

.actions {

    display: flex;

    gap: 8px;

    margin-top: 12px;
}

.action {

    border:
        1px solid #3a3a3a;

    background: #202020;

    color: white;

    padding:
        10px 15px;

    border-radius: 11px;

    font-size: 13px;

    font-weight: 800;

    touch-action: manipulation;

    -webkit-touch-callout: none;

    -webkit-user-select: none;
    user-select: none;
}


/* =====================================================
   CLEAR SCREEN
   ===================================================== */

#clearScreen {

    position: fixed;

    inset: 0;

    display: none;

    align-items: center;

    justify-content: center;

    background:
        rgba(0,0,0,.78);

    z-index: 100;

    touch-action: none;
}

.modal {

    width: min(85vw, 340px);

    padding: 28px;

    background: #1c1c1c;

    border:
        1px solid #414141;

    border-radius: 22px;

    text-align: center;

    box-shadow:
        0 20px 60px rgba(0,0,0,.7);
}

.modal h2 {

    margin: 0 0 8px;

    font-size: 30px;
}

.modal p {

    margin: 0 0 20px;

    color: #aaa;
}

.next {

    width: 100%;

    border: 0;

    border-radius: 13px;

    padding: 14px;

    background: #48e965;

    color: #071009;

    font-size: 16px;

    font-weight: 900;

    touch-action: manipulation;
}


/* =====================================================
   SMALL SCREEN
   ===================================================== */

@media (max-height: 700px) {

    #game {

        padding-top: 7px;
    }

    .title {

        font-size: 20px;
    }

    #board {

        width: min(88vw, 400px);
    }

    .controls {

        grid-template-columns:
            58px 58px 58px;

        grid-template-rows:
            45px 45px;

        margin-top: 7px;
    }

    .actions {

        margin-top: 7px;
    }
}

</style>

</head>


<body>


<div id="game">


    <!-- HEADER -->

    <div class="header">

        <div class="title">
            🐍 SNAKE PUZZLE
        </div>

        <div class="level">

            LEVEL
            <span id="level">1</span>

        </div>

    </div>


    <!-- INFO -->

    <div class="info">

        <div>
            MOVES
            <strong id="moves">0</strong>
        </div>

        <div>
            BEST
            <strong id="best">—</strong>
        </div>

    </div>


    <!-- BOARD -->

    <div id="board"></div>


    <!-- CONTROLS -->

    <div class="controls">

        <button
            class="control up"
            id="up">
            ▲
        </button>

        <button
            class="control left"
            id="left">
            ◀
        </button>

        <button
            class="control down"
            id="down">
            ▼
        </button>

        <button
            class="control right"
            id="right">
            ▶
        </button>

    </div>


    <!-- ACTIONS -->

    <div class="actions">

        <button
            class="action"
            id="restart">
            ↻ リセット
        </button>

        <button
            class="action"
            id="next">
            次のステージ
        </button>

    </div>


</div>


<!-- CLEAR -->

<div id="clearScreen">

    <div class="modal">

        <h2>🎉 CLEAR!</h2>

        <p>
            MOVES:
            <strong id="clearMoves">0</strong>
        </p>

        <button
            class="next"
            id="nextLevel">
            NEXT LEVEL
        </button>

    </div>

</div>


<script>

/* =====================================================
   iPhone ブラウザ対策
   ===================================================== */


/*
   長押しメニューを禁止
*/

document.addEventListener(
    "contextmenu",
    function(e) {

        e.preventDefault();

    },
    {
        passive: false
    }
);


/*
   テキスト選択を禁止
*/

document.addEventListener(
    "selectstart",
    function(e) {

        e.preventDefault();

    },
    {
        passive: false
    }
);


/*
   ジェスチャーによるズームを禁止
*/

document.addEventListener(
    "gesturestart",
    function(e) {

        e.preventDefault();

    },
    {
        passive: false
    }
);

document.addEventListener(
    "gesturechange",
    function(e) {

        e.preventDefault();

    },
    {
        passive: false
    }
);

document.addEventListener(
    "gestureend",
    function(e) {

        e.preventDefault();

    },
    {
        passive: false
    }
);


/*
   ダブルタップズーム防止
*/

let lastTouchTime = 0;

document.addEventListener(
    "touchend",
    function(e) {

        const now =
            Date.now();

        if (
            now - lastTouchTime < 350
        ) {

            e.preventDefault();

        }

        lastTouchTime = now;

    },
    {
        passive: false
    }
);


/* =====================================================
   GAME
   ===================================================== */

const SIZE = 8;


/* =====================================================
   STAGES
   ===================================================== */

const stages = [

    {

        snake: [
            {x:1,y:6},
            {x:1,y:5},
            {x:1,y:4}
        ],

        goal: {
            x:6,
            y:1
        },

        walls: [

            [3,0],
            [3,1],
            [3,2],
            [3,3],

            [5,3],
            [5,4],
            [5,5],

            [2,6],
            [3,6],
            [4,6]

        ]

    },


    {

        snake: [
            {x:1,y:1},
            {x:2,y:1},
            {x:3,y:1}
        ],

        goal: {
            x:6,
            y:6
        },

        walls: [

            [0,3],
            [1,3],
            [2,3],

            [4,1],
            [4,2],
            [4,3],

            [5,4],
            [6,4],
            [7,4],

            [2,6]

        ]

    },


    {

        snake: [
            {x:6,y:6},
            {x:6,y:5},
            {x:6,y:4},
            {x:5,y:4}
        ],

        goal: {
            x:1,
            y:1
        },

        walls: [

            [1,2],
            [2,2],
            [3,2],
            [4,2],

            [3,3],

            [1,5],
            [2,5],
            [3,5],

            [5,1]

        ]

    },


    {

        snake: [
            {x:1,y:6},
            {x:2,y:6},
            {x:3,y:6},
            {x:3,y:5}
        ],

        goal: {
            x:6,
            y:1
        },

        walls: [

            [1,1],
            [2,1],
            [3,1],

            [5,2],
            [5,3],
            [5,4],

            [1,4],
            [2,4],

            [3,3],
            [4,3]

        ]

    },


    {

        snake: [
            {x:6,y:1},
            {x:6,y:2},
            {x:5,y:2},
            {x:4,y:2}
        ],

        goal: {
            x:1,
            y:6
        },

        walls: [

            [2,0],
            [2,1],
            [2,2],

            [4,4],
            [5,4],
            [6,4],

            [3,6],
            [4,6],
            [5,6],

            [1,3]

        ]

    }

];


/* =====================================================
   STATE
   ===================================================== */

let currentStage = 0;

let snake = [];

let goal = {};

let walls = [];

let moves = 0;

let finished = false;


/* =====================================================
   DOM
   ===================================================== */

const board =
    document.getElementById("board");

const level =
    document.getElementById("level");

const movesElement =
    document.getElementById("moves");

const best =
    document.getElementById("best");

const clearScreen =
    document.getElementById("clearScreen");

const clearMoves =
    document.getElementById("clearMoves");


/* =====================================================
   LOAD
   ===================================================== */

function loadStage(index) {

    currentStage =
        index % stages.length;

    const stage =
        stages[currentStage];


    snake =
        stage.snake.map(function(p) {

            return {
                x: p.x,
                y: p.y
            };

        });


    goal = {

        x: stage.goal.x,
        y: stage.goal.y

    };


    walls =
        stage.walls.map(function(p) {

            return {
                x: p[0],
                y: p[1]
            };

        });


    moves = 0;

    finished = false;


    level.textContent =
        currentStage + 1;

    movesElement.textContent =
        "0";


    clearScreen.style.display =
        "none";


    updateBest();

    draw();

}


/* =====================================================
   DRAW
   ===================================================== */

function draw() {

    board.innerHTML = "";


    for (
        let y = 0;
        y < SIZE;
        y++
    ) {

        for (
            let x = 0;
            x < SIZE;
            x++
        ) {

            const cell =
                document.createElement("div");


            cell.className =
                "cell";


            /*
               壁
            */

            if (
                isWall(x,y)
            ) {

                cell.classList.add(
                    "wall"
                );

            }


            /*
               ゴール
            */

            if (
                goal.x === x &&
                goal.y === y
            ) {

                cell.classList.add(
                    "goal"
                );

            }


            /*
               蛇
            */

            const snakeIndex =
                snake.findIndex(
                    function(p) {

                        return (
                            p.x === x &&
                            p.y === y
                        );

                    }
                );


            if (
                snakeIndex !== -1
            ) {

                cell.classList.add(
                    "snake"
                );


                if (
                    snakeIndex === 0
                ) {

                    cell.classList.add(
                        "snake-head"
                    );

                }

            }


            board.appendChild(cell);

        }

    }

}


/* =====================================================
   WALL
   ===================================================== */

function isWall(x,y) {

    return walls.some(
        function(p) {

            return (
                p.x === x &&
                p.y === y
            );

        }
    );

}


/* =====================================================
   MOVE
   ===================================================== */

function move(dx,dy) {

    if (finished) {
        return;
    }


    const head =
        snake[0];


    const next = {

        x: head.x + dx,
        y: head.y + dy

    };


    /*
       場外
    */

    if (
        next.x < 0 ||
        next.x >= SIZE ||
        next.y < 0 ||
        next.y >= SIZE
    ) {

        bump();

        return;

    }


    /*
       壁
    */

    if (
        isWall(
            next.x,
            next.y
        )
    ) {

        bump();

        return;

    }


    /*
       自分自身
    */

    if (
        snake.some(
            function(p) {

                return (
                    p.x === next.x &&
                    p.y === next.y
                );

            }
        )
    ) {

        bump();

        return;

    }


    /*
       移動
    */

    snake.unshift(next);

    moves++;

    /*
       4マスを維持
    */

    while (
        snake.length > 4
    ) {

        snake.pop();

    }


    movesElement.textContent =
        moves;


    draw();


    /*
       ゴール
    */

    if (
        next.x === goal.x &&
        next.y === goal.y
    ) {

        clearStage();

    }

}


/* =====================================================
   BUMP
   ===================================================== */

function bump() {

    board.animate(
        [
            {
                transform:
                    "translateX(-5px)"
            },
            {
                transform:
                    "translateX(5px)"
            },
            {
                transform:
                    "translateX(-3px)"
            },
            {
                transform:
                    "translateX(0)"
            }
        ],
        {
            duration: 130
        }
    );

}


/* =====================================================
   CLEAR
   ===================================================== */

function clearStage() {

    finished = true;

    clearMoves.textContent =
        moves;


    saveBest();


    setTimeout(
        function() {

            clearScreen.style.display =
                "flex";

        },
        150
    );

}


/* =====================================================
   RESTART
   ===================================================== */

function restart() {

    loadStage(
        currentStage
    );

}


/* =====================================================
   NEXT
   ===================================================== */

function nextStage() {

    loadStage(
        currentStage + 1
    );

}


/* =====================================================
   BEST
   ===================================================== */

function bestKey() {

    return (
        "snake_puzzle_best_" +
        currentStage
    );

}


function updateBest() {

    const value =
        localStorage.getItem(
            bestKey()
        );


    best.textContent =
        value || "—";

}


function saveBest() {

    const old =
        localStorage.getItem(
            bestKey()
        );


    if (
        !old ||
        moves < Number(old)
    ) {

        localStorage.setItem(
            bestKey(),
            moves
        );

    }


    updateBest();

}


/* =====================================================
   BUTTON
   ===================================================== */

function button(id, action) {

    const element =
        document.getElementById(id);


    element.addEventListener(
        "pointerdown",
        function(e) {

            e.preventDefault();

            action();

        },
        {
            passive: false
        }
    );

}


/* =====================================================
   CONTROLS
   ===================================================== */

button(
    "up",
    function() {
        move(0,-1);
    }
);

button(
    "down",
    function() {
        move(0,1);
    }
);

button(
    "left",
    function() {
        move(-1,0);
    }
);

button(
    "right",
    function() {
        move(1,0);
    }
);

button(
    "restart",
    restart
);

button(
    "next",
    nextStage
);

button(
    "nextLevel",
    nextStage
);


/* =====================================================
   KEYBOARD
   ===================================================== */

document.addEventListener(
    "keydown",
    function(e) {

        if (
            e.key === "ArrowUp" ||
            e.key === "w"
        ) {

            e.preventDefault();

            move(0,-1);

        }


        if (
            e.key === "ArrowDown" ||
            e.key === "s"
        ) {

            e.preventDefault();

            move(0,1);

        }


        if (
            e.key === "ArrowLeft" ||
            e.key === "a"
        ) {

            e.preventDefault();

            move(-1,0);

        }


        if (
            e.key === "ArrowRight" ||
            e.key === "d"
        ) {

            e.preventDefault();

            move(1,0);

        }


        if (
            e.key === "r" ||
            e.key === "R"
        ) {

            restart();

        }

    }
);


/* =====================================================
   SWIPE
   ===================================================== */

let startX = 0;
let startY = 0;

let touching = false;


board.addEventListener(
    "touchstart",
    function(e) {

        e.preventDefault();

        if (!e.changedTouches.length) {
            return;
        }


        const touch =
            e.changedTouches[0];


        startX =
            touch.clientX;

        startY =
            touch.clientY;

        touching = true;

    },
    {
        passive: false
    }
);


board.addEventListener(
    "touchmove",
    function(e) {

        e.preventDefault();

    },
    {
        passive: false
    }
);


board.addEventListener(
    "touchend",
    function(e) {

        e.preventDefault();


        if (!touching) {
            return;
        }


        touching = false;


        if (!e.changedTouches.length) {
            return;
        }


        const touch =
            e.changedTouches[0];


        const dx =
            touch.clientX -
            startX;


        const dy =
            touch.clientY -
            startY;


        const threshold = 25;


        if (
            Math.abs(dx) <
                threshold &&
            Math.abs(dy) <
                threshold
        ) {

            return;

        }


        if (
            Math.abs(dx) >
            Math.abs(dy)
        ) {

            if (dx > 0) {

                move(1,0);

            } else {

                move(-1,0);

            }

        } else {

            if (dy > 0) {

                move(0,1);

            } else {

                move(0,-1);

            }

        }

    },
    {
        passive: false
    }
);


/* =====================================================
   START
   ===================================================== */

loadStage(0);

</script>

</body>

</html>
